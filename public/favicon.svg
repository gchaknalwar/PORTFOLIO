<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Dark Cyberpunk Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#03050a"/>
      <stop offset="100%" stop-color="#080c14"/>
    </linearGradient>

    <!-- Neon Electric Blue Gradient -->
    <linearGradient id="neonBlue" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#60a5fa"/>
      <stop offset="50%" stop-color="#3b82f6"/>
      <stop offset="100%" stop-color="#6366f1"/>
    </linearGradient>

    <!-- Outer Border Glow Effect -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Base Container -->
  <rect width="512" height="512" rx="128" fill="url(#bgGrad)"/>
  
  <!-- Outer Neon Border -->
  <rect x="16" y="16" width="480" height="480" rx="112" fill="none" stroke="url(#neonBlue)" stroke-width="8" stroke-opacity="0.4" />

  <!-- Code Bracket Design (Left) -->
  <path d="M 140 170 L 80 256 L 140 342" fill="none" stroke="url(#neonBlue)" stroke-width="28" stroke-linecap="round" stroke-linejoin="round" filter="url(#glow)" />

  <!-- Code Bracket Design (Right) -->
  <path d="M 372 170 L 432 256 L 372 342" fill="none" stroke="url(#neonBlue)" stroke-width="28" stroke-linecap="round" stroke-linejoin="round" filter="url(#glow)" />

  <!-- Monogram GC Monospace Typography -->
  <text 
    x="256" 
    y="290" 
    font-family="system-ui, -apple-system, sans-serif" 
    font-weight="900" 
    font-size="160" 
    letter-spacing="-6"
    fill="url(#neonBlue)" 
    text-anchor="middle"
    filter="url(#glow)"
  >
    GC
  </text>

  <!-- Top Right Terminal Status Dot -->
  <circle cx="410" cy="102" r="20" fill="#60a5fa" />
</svg>
